spring:
  application:
    name: msuser
  security:
    oauth2:
  datasource:
    url: jdbc:postgresql://localhost:5432/msuser
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8087
eureka:
  client:
    service-url:
      defaultZone: http://cursoms-eureka-user:cursoms-eureka-user@localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
springdoc:
  override-with-generic-response: false
logging:
  level:
    # 💡 Printa a exceção exata (ex: Invalid Redirect URI, Scope Mismatch) no console
    org.springframework.security.oauth2.server.authorization.authentication: TRACE